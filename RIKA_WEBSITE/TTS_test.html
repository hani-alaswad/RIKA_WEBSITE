<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قارئ النص</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            text-align: center;
            margin-bottom: 25px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 18px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #3498db;
        }
        .controls {
            margin: 20px 0;
        }
        .control-group {
            margin-bottom: 18px;
        }
        .control-group label {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .control-group .value {
            color: #3498db;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #dde1e6;
            border-radius: 5px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #3498db;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #3498db;
            cursor: pointer;
            border: none;
        }
        .btn {
            width: 100%;
            padding: 16px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            background: #2980b9;
            transform: scale(1.02);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }
        .btn.stopped {
            background: #e74c3c;
        }
        #status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            background: #f8f9fa;
            min-height: 50px;
            text-align: center;
            color: #2c3e50;
            font-size: 15px;
            border: 1px solid #e0e0e0;
            word-wrap: break-word;
        }
        #status.error {
            background: #fde8e8;
            border-color: #f5c6c6;
            color: #a94442;
        }
        #status.success {
            background: #e8f4e8;
            border-color: #c6e5c6;
            color: #2d6a2d;
        }
        #status.warning {
            background: #fff3cd;
            border-color: #ffc107;
            color: #856404;
        }
        #status.info {
            background: #d1ecf1;
            border-color: #bee5eb;
            color: #0c5460;
        }
        .voice-info {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 14px;
            color: #666;
            text-align: center;
            border: 1px dashed #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔊 -¦- قارئ النص</h1>
        
        <textarea id="textInput" placeholder="اكتب النص هنا...">مرحباً، هذا اختبار لخاصية تحويل النص إلى كلام باللغة العربية.</textarea>
        
        <div class="controls">
            <div class="control-group">
                <label>
                    <span>السرعة</span>
                    <span class="value" id="speedValue">1.0</span>
                </label>
                <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1.0">
            </div>
            
            <div class="control-group">
                <label>
                    <span>النبرة</span>
                    <span class="value" id="pitchValue">1.0</span>
                </label>
                <input type="range" id="pitchSlider" min="0.5" max="2" step="0.1" value="1.0">
            </div>
        </div>
        
        <button class="btn" id="readBtn">📖 اقرأ النص</button>
        
        <div id="status">⏳ جاهز للقراءة...</div>
        <div class="voice-info" id="voiceInfo">📢 جاري تحميل محركات الصوت...</div>
    </div>

    <script>
        (function() {
            'use strict';

            const statusDiv = document.getElementById('status');
            const voiceInfo = document.getElementById('voiceInfo');
            const textInput = document.getElementById('textInput');
            const speedSlider = document.getElementById('speedSlider');
            const pitchSlider = document.getElementById('pitchSlider');
            const speedValue = document.getElementById('speedValue');
            const pitchValue = document.getElementById('pitchValue');
            const readBtn = document.getElementById('readBtn');

            let isSpeaking = false;
            let currentUtterance = null;
            let isInitialized = false;

            // تحديث القيم المعروضة
            speedSlider.addEventListener('input', function() {
                speedValue.textContent = parseFloat(this.value).toFixed(1);
            });

            pitchSlider.addEventListener('input', function() {
                pitchValue.textContent = parseFloat(this.value).toFixed(1);
            });

            // دالة عرض الحالة
            function setStatus(message, type = 'info') {
                statusDiv.textContent = message;
                statusDiv.className = type || '';
            }

            // دالة إعادة ضبط الزر
            function resetButton() {
                readBtn.textContent = '📖 اقرأ النص';
                readBtn.classList.remove('stopped');
                readBtn.disabled = false;
                isSpeaking = false;
                currentUtterance = null;
            }

            // دالة إعداد زر الإيقاف
            function setStopButton() {
                readBtn.textContent = '⏹️ إيقاف';
                readBtn.classList.add('stopped');
                readBtn.disabled = false;
                isSpeaking = true;
            }

            // التحقق من دعم التطبيق
            if (!('speechSynthesis' in window)) {
                setStatus('❌ متصفحك لا يدعم خاصية تحويل النص إلى كلام', 'error');
                readBtn.disabled = true;
                voiceInfo.textContent = '❌ غير مدعوم';
                return;
            }

            // دالة الحصول على الأصوات المتاحة
            function getAvailableVoices() {
                try {
                    return window.speechSynthesis.getVoices() || [];
                } catch (e) {
                    return [];
                }
            }

            // دالة تحميل الأصوات وتحديث الواجهة
            function updateVoiceInfo() {
                try {
                    const voices = getAvailableVoices();
                    
                    if (voices.length === 0) {
                        voiceInfo.textContent = '⚠️ لم يتم تحميل الأصوات بعد، انتظر لحظة...';
                        return;
                    }

                    // البحث عن أصوات عربية
                    const arabicVoices = voices.filter(v => v.lang && v.lang.startsWith('ar'));
                    
                    let infoText = '';
                    if (arabicVoices.length > 0) {
                        infoText = `✅ تم العثور على ${arabicVoices.length} صوت عربي`;
                        if (arabicVoices[0].name) {
                            infoText += ` (مثال: ${arabicVoices[0].name})`;
                        }
                        setStatus('✅ التطبيق جاهز مع الصوت العربي', 'success');
                    } else {
                        infoText = `⚠️ لا توجد أصوات عربية، سيتم استخدام الصوت الافتراضي`;
                        setStatus('⚠️ لا توجد أصوات عربية في جهازك', 'warning');
                    }
                    
                    voiceInfo.textContent = infoText;
                    isInitialized = true;
                } catch (e) {
                    voiceInfo.textContent = '⚠️ حدث خطأ في تحميل الأصوات';
                }
            }

            // محاولة تحميل الأصوات بعد تأخير
            function loadVoicesWithDelay() {
                // أول محاولة فورية
                setTimeout(updateVoiceInfo, 100);
                
                // محاولة ثانية بعد 500ms
                setTimeout(updateVoiceInfo, 500);
                
                // محاولة ثالثة بعد 1.5 ثانية
                setTimeout(updateVoiceInfo, 1500);
                
                // محاولة رابعة بعد 3 ثواني
                setTimeout(updateVoiceInfo, 3000);
            }

            // استخدام onvoiceschanged إن أمكن
            if (window.speechSynthesis.onvoiceschanged !== undefined) {
                window.speechSynthesis.onvoiceschanged = function() {
                    updateVoiceInfo();
                };
            }

            // بدء تحميل الأصوات
            loadVoicesWithDelay();

            // معالجة خاصة للأندرويد لمنع الخروج من المتصفح
            if (/Android/i.test(navigator.userAgent)) {
                // منع أي حدث قد يغلق المتصفح
                document.addEventListener('visibilitychange', function(e) {
                    e.stopPropagation();
                }, true);
                
                // منع الأخطاء التي قد تغلق المتصفح
                window.addEventListener('error', function(e) {
                    e.preventDefault();
                    return true;
                }, true);
            }

            // دالة قراءة النص
            function speakText() {
                const text = textInput.value.trim();
                
                if (!text) {
                    setStatus('⚠️ الرجاء إدخال نص للقراءة', 'error');
                    return;
                }

                // إلغاء أي قراءة سابقة
                try {
                    if (window.speechSynthesis.speaking) {
                        window.speechSynthesis.cancel();
                    }
                } catch (e) {
                    // تجاهل
                }

                // إنشاء كائن الكلام
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = parseFloat(speedSlider.value) || 1;
                utterance.pitch = parseFloat(pitchSlider.value) || 1;
                utterance.volume = 1;

                // محاولة تعيين صوت عربي
                try {
                    const voices = getAvailableVoices();
                    
                    // البحث عن أفضل صوت عربي
                    let selectedVoice = null;
                    
                    // 1. حاول العثور على صوت عربي من Google
                    selectedVoice = voices.find(v => 
                        v.lang && v.lang.startsWith('ar') && 
                        v.name && v.name.toLowerCase().includes('google')
                    );
                    
                    // 2. إذا لم يوجد، خذ أي صوت عربي
                    if (!selectedVoice) {
                        selectedVoice = voices.find(v => v.lang && v.lang.startsWith('ar'));
                    }
                    
                    // 3. إذا لم يوجد، خذ أي صوت
                    if (!selectedVoice && voices.length > 0) {
                        selectedVoice = voices[0];
                    }
                    
                    if (selectedVoice) {
                        utterance.voice = selectedVoice;
                    }
                } catch (e) {
                    // تجاهل
                }

                currentUtterance = utterance;

                // أحداث التطبيق
                utterance.onstart = function() {
                    setStatus('🔊 جاري القراءة...', 'info');
                    setStopButton();
                };

                utterance.onend = function() {
                    setStatus('✅ انتهت القراءة بنجاح', 'success');
                    resetButton();
                };

                utterance.onerror = function(event) {
                    // تجاهل أخطاء الإيقاف المتعمد
                    if (event.error === 'interrupted' || event.error === 'canceled') {
                        setStatus('⏹️ تم إيقاف القراءة', 'info');
                        resetButton();
                        return;
                    }

                    // محاولة إعادة المحاولة مرة واحدة
                    if (event.error === 'synthesis-failed' || event.error === 'audio-busy') {
                        setStatus('⚠️ فشل التشغيل، جاري المحاولة مرة أخرى...', 'warning');
                        setTimeout(() => {
                            try {
                                window.speechSynthesis.speak(utterance);
                            } catch (e) {
                                setStatus('❌ فشل التشغيل مرة أخرى', 'error');
                                resetButton();
                            }
                        }, 500);
                        return;
                    }

                    let errorMsg = '❌ حدث خطأ: ';
                    switch(event.error) {
                        case 'not-allowed':
                            errorMsg += 'الرجاء السماح للتطبيق باستخدام الصوت';
                            break;
                        case 'synthesis-unavailable':
                            errorMsg += 'خدمة الترجمة الصوتية غير متوفرة حالياً';
                            break;
                        default:
                            errorMsg += event.error;
                    }
                    setStatus(errorMsg, 'error');
                    resetButton();
                };

                // محاولة القراءة
                try {
                    window.speechSynthesis.speak(utterance);
                } catch (e) {
                    setStatus('❌ خطأ غير متوقع: ' + e.message, 'error');
                    resetButton();
                }
            }

            // دالة إيقاف القراءة
            function stopSpeaking() {
                try {
                    if (window.speechSynthesis.speaking) {
                        window.speechSynthesis.cancel();
                    }
                } catch (e) {
                    // تجاهل
                }
                setStatus('⏹️ تم الإيقاف', 'info');
                resetButton();
            }

            // معالج الزر
            readBtn.addEventListener('click', function(e) {
                e.preventDefault();
                
                if (readBtn.disabled) return;

                if (isSpeaking) {
                    stopSpeaking();
                    return;
                }

                speakText();
            });

            // معالج خاص للأندرويد لمنع الخروج
            if (/Android/i.test(navigator.userAgent)) {
                // منع الأحداث غير المرغوب فيها
                document.addEventListener('touchstart', function(e) {
                    e.stopPropagation();
                }, { passive: true, capture: true });
                
                document.addEventListener('touchend', function(e) {
                    e.stopPropagation();
                }, { passive: true, capture: true });
            }

            // إعادة تعيين الحالة عند فقدان التركيز
            window.addEventListener('beforeunload', function() {
                try {
                    if (window.speechSynthesis.speaking) {
                        window.speechSynthesis.cancel();
                    }
                } catch (e) {}
            });

            // تحديث الأصوات عند العودة للتطبيق
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    setTimeout(updateVoiceInfo, 500);
                }
            });

            console.log('✅ قارئ النص جاهز');
        })();
    </script>
</body>
</html>
