<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قارئ النص</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            text-align: center;
            margin-bottom: 25px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 18px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #3498db;
        }
        .controls {
            margin: 20px 0;
        }
        .control-group {
            margin-bottom: 18px;
        }
        .control-group label {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .control-group .value {
            color: #3498db;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #dde1e6;
            border-radius: 5px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #3498db;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #3498db;
            cursor: pointer;
            border: none;
        }
        .btn {
            width: 100%;
            padding: 16px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            background: #2980b9;
            transform: scale(1.02);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }
        .btn.stopped {
            background: #e74c3c;
        }
        #status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            background: #f8f9fa;
            min-height: 50px;
            text-align: center;
            color: #2c3e50;
            font-size: 15px;
            border: 1px solid #e0e0e0;
        }
        #status.error {
            background: #fde8e8;
            border-color: #f5c6c6;
            color: #a94442;
        }
        #status.success {
            background: #e8f4e8;
            border-color: #c6e5c6;
            color: #2d6a2d;
        }
        #status.warning {
            background: #fff3cd;
            border-color: #ffc107;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔊 = قارئ النص </h1>
        
        <textarea id="textInput" placeholder="اكتب النص هنا...">مرحباً، هذا اختبار لخاصية تحويل النص إلى كلام.</textarea>
        
        <div class="controls">
            <div class="control-group">
                <label>
                    <span>السرعة</span>
                    <span class="value" id="speedValue">1.0</span>
                </label>
                <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1.0">
            </div>
            
            <div class="control-group">
                <label>
                    <span>النبرة</span>
                    <span class="value" id="pitchValue">1.0</span>
                </label>
                <input type="range" id="pitchSlider" min="0.5" max="2" step="0.1" value="1.0">
            </div>
        </div>
        
        <button class="btn" id="readBtn">📖 اقرأ النص</button>
        
        <div id="status">⏳ جاهز للقراءة...</div>
    </div>

    <script>
        (function() {
            'use strict';

            const statusDiv = document.getElementById('status');
            const textInput = document.getElementById('textInput');
            const speedSlider = document.getElementById('speedSlider');
            const pitchSlider = document.getElementById('pitchSlider');
            const speedValue = document.getElementById('speedValue');
            const pitchValue = document.getElementById('pitchValue');
            const readBtn = document.getElementById('readBtn');

            let currentUtterance = null;
            let isSpeaking = false;

            // تحديث القيم المعروضة للمنزلقتين
            speedSlider.addEventListener('input', function() {
                speedValue.textContent = parseFloat(this.value).toFixed(1);
            });

            pitchSlider.addEventListener('input', function() {
                pitchValue.textContent = parseFloat(this.value).toFixed(1);
            });

            // دالة عرض الحالة
            function setStatus(message, type = 'info') {
                statusDiv.textContent = message;
                statusDiv.className = type || '';
            }

            // دالة إعادة ضبط الزر
            function resetButton() {
                readBtn.textContent = '📖 اقرأ النص';
                readBtn.classList.remove('stopped');
                readBtn.disabled = false;
                isSpeaking = false;
                currentUtterance = null;
            }

            // دالة إعداد زر الإيقاف
            function setStopButton() {
                readBtn.textContent = '⏹️ إيقاف';
                readBtn.classList.add('stopped');
                readBtn.disabled = false;
                isSpeaking = true;
            }

            // التحقق من دعم التطبيق
            if (!('speechSynthesis' in window)) {
                setStatus('❌ متصفحك لا يدعم خاصية تحويل النص إلى كلام', 'error');
                readBtn.disabled = true;
                return;
            }

            // التحقق من توفر الأصوات العربية (قد تكون غير مثبتة)
            function checkArabicVoice() {
                const voices = window.speechSynthesis.getVoices();
                const arabicVoice = voices.find(v => v.lang.startsWith('ar'));
                if (!arabicVoice) {
                    setStatus('⚠️ قد لا تتوفر أصوات عربية في هذا الجهاز. سيتم استخدام الصوت الافتراضي.', 'warning');
                }
            }

            // محاولة تحميل الأصوات (قد تحتاج لبعض الوقت في كروم)
            if (window.speechSynthesis.getVoices().length === 0) {
                window.speechSynthesis.onvoiceschanged = function() {
                    checkArabicVoice();
                };
            } else {
                checkArabicVoice();
            }

            setStatus('✅ التطبيق جاهز، اختر نصاً واضغط اقرأ', 'success');

            // دالة قراءة النص
            function speakText() {
                const text = textInput.value.trim();
                
                // التحقق من وجود نص
                if (!text) {
                    setStatus('⚠️ الرجاء إدخال نص للقراءة', 'error');
                    return;
                }

                // إلغاء أي قراءة سابقة
                if (window.speechSynthesis.speaking) {
                    window.speechSynthesis.cancel();
                }

                // إنشاء كائن الكلام
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = parseFloat(speedSlider.value);
                utterance.pitch = parseFloat(pitchSlider.value);
                utterance.volume = 1;

                // محاولة تعيين صوت عربي إذا وجد
                try {
                    const voices = window.speechSynthesis.getVoices();
                    const arabicVoice = voices.find(v => v.lang.startsWith('ar'));
                    if (arabicVoice) {
                        utterance.voice = arabicVoice;
                    }
                } catch (e) {
                    // تجاهل خطأ تعيين الصوت
                }

                currentUtterance = utterance;

                // أحداث التطبيق
                utterance.onstart = function() {
                    setStatus('🔊 جاري القراءة...', 'info');
                    setStopButton();
                };

                utterance.onend = function() {
                    setStatus('✅ انتهت القراءة بنجاح', 'success');
                    resetButton();
                };

                utterance.onerror = function(event) {
                    // تجاهل خطأ interrupted إذا تم الإيقاف عمداً
                    if (event.error === 'interrupted') {
                        setStatus('⏹️ تم إيقاف القراءة', 'info');
                        resetButton();
                        return;
                    }

                    let errorMsg = '❌ حدث خطأ: ';
                    switch(event.error) {
                        case 'not-allowed':
                            errorMsg += 'الرجاء السماح للتطبيق باستخدام الصوت';
                            break;
                        case 'synthesis-unavailable':
                            errorMsg += 'خدمة الترجمة الصوتية غير متوفرة حالياً';
                            break;
                        case 'synthesis-failed':
                            errorMsg += 'فشل تحويل النص إلى كلام';
                            break;
                        default:
                            errorMsg += event.error;
                    }
                    setStatus(errorMsg, 'error');
                    resetButton();
                };

                // محاولة القراءة
                try {
                    window.speechSynthesis.speak(utterance);
                } catch (e) {
                    setStatus('❌ خطأ غير متوقع: ' + e.message, 'error');
                    resetButton();
                }
            }

            // دالة إيقاف القراءة
            function stopSpeaking() {
                if (window.speechSynthesis.speaking) {
                    window.speechSynthesis.cancel();
                }
                setStatus('⏹️ تم الإيقاف', 'info');
                resetButton();
            }

            // معالج واحد فقط للزر
            readBtn.addEventListener('click', function() {
                // منع النقر المتعدد السريع
                if (readBtn.disabled) return;

                // إذا كان الزر في حالة إيقاف، أوقف القراءة
                if (isSpeaking) {
                    stopSpeaking();
                    return;
                }

                // وإلا اقرأ النص
                speakText();
            });

            // إعادة تعيين الحالة عند فقدان التركيز
            window.addEventListener('beforeunload', function() {
                if (window.speechSynthesis.speaking) {
                    window.speechSynthesis.cancel();
                }
            });

            // معالجة حالة فقدان الصوت في الخلفية (مهم للأندرويد)
            document.addEventListener('visibilitychange', function() {
                if (document.hidden && window.speechSynthesis.speaking) {
                    // في بعض الأحيان يتوقف الصوت تلقائياً عند الخلفية
                    // نتحقق بعد العودة إذا كان لا يزال يتحدث
                }
            });

            // التحقق الدوري من حالة الكلام (لتصحيح حالة الزر)
            setInterval(function() {
                if (isSpeaking && !window.speechSynthesis.speaking && currentUtterance) {
                    // إذا كان الكلام قد توقف بدون حدث onend (مشكلة في بعض المتصفحات)
                    resetButton();
                    setStatus('⏹️ توقفت القراءة', 'info');
                }
            }, 5000);

        })();
    </script>
</body>
</html>
