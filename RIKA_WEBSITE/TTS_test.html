<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قارئ النص</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            text-align: center;
            margin-bottom: 25px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 18px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #3498db;
        }
        .controls {
            margin: 20px 0;
        }
        .control-group {
            margin-bottom: 18px;
        }
        .control-group label {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .control-group .value {
            color: #3498db;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #dde1e6;
            border-radius: 5px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #3498db;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #3498db;
            cursor: pointer;
            border: none;
        }
        .btn {
            width: 100%;
            padding: 16px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            background: #2980b9;
            transform: scale(1.02);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }
        .btn.stopped {
            background: #e74c3c;
        }
        #status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            background: #f8f9fa;
            min-height: 50px;
            text-align: center;
            color: #2c3e50;
            font-size: 15px;
            border: 1px solid #e0e0e0;
            word-wrap: break-word;
        }
        #status.error {
            background: #fde8e8;
            border-color: #f5c6c6;
            color: #a94442;
        }
        #status.success {
            background: #e8f4e8;
            border-color: #c6e5c6;
            color: #2d6a2d;
        }
        #status.warning {
            background: #fff3cd;
            border-color: #ffc107;
            color: #856404;
        }
        #status.info {
            background: #d1ecf1;
            border-color: #bee5eb;
            color: #0c5460;
        }
        .voice-select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            background: white;
            margin-top: 10px;
            direction: ltr;
        }
        .voice-select:focus {
            outline: none;
            border-color: #3498db;
        }
        .voice-select option {
            direction: ltr;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔊 قارئ النص</h1>
        
        <textarea id="textInput" placeholder="اكتب النص هنا...">مرحباً، هذا اختبار لخاصية تحويل النص إلى كلام باللغة العربية.</textarea>
        
        <div class="controls">
            <div class="control-group">
                <label>
                    <span>السرعة</span>
                    <span class="value" id="speedValue">1.0</span>
                </label>
                <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1.0">
            </div>
            
            <div class="control-group">
                <label>
                    <span>النبرة</span>
                    <span class="value" id="pitchValue">1.0</span>
                </label>
                <input type="range" id="pitchSlider" min="0.5" max="2" step="0.1" value="1.0">
            </div>

            <div class="control-group">
                <label>
                    <span>اختر الصوت</span>
                </label>
                <select class="voice-select" id="voiceSelect">
                    <option value="">جاري تحميل الأصوات...</option>
                </select>
            </div>
        </div>
        
        <button class="btn" id="readBtn">📖 اقرأ النص</button>
        
        <div id="status">⏳ جاهز للقراءة...</div>
    </div>

    <script>
        (function() {
            'use strict';

            const statusDiv = document.getElementById('status');
            const textInput = document.getElementById('textInput');
            const speedSlider = document.getElementById('speedSlider');
            const pitchSlider = document.getElementById('pitchSlider');
            const speedValue = document.getElementById('speedValue');
            const pitchValue = document.getElementById('pitchValue');
            const readBtn = document.getElementById('readBtn');
            const voiceSelect = document.getElementById('voiceSelect');

            let voices = [];
            let isSpeaking = false;
            let currentUtterance = null;
            let isPaused = false;

            // تحديث القيم المعروضة للمنزلقتين
            speedSlider.addEventListener('input', function() {
                speedValue.textContent = parseFloat(this.value).toFixed(1);
            });

            pitchSlider.addEventListener('input', function() {
                pitchValue.textContent = parseFloat(this.value).toFixed(1);
            });

            // دالة عرض الحالة
            function setStatus(message, type = 'info') {
                statusDiv.textContent = message;
                statusDiv.className = type || '';
            }

            // دالة إعادة ضبط الزر
            function resetButton() {
                readBtn.textContent = '📖 اقرأ النص';
                readBtn.classList.remove('stopped');
                readBtn.disabled = false;
                isSpeaking = false;
                isPaused = false;
                currentUtterance = null;
            }

            // دالة إعداد زر الإيقاف
            function setStopButton() {
                readBtn.textContent = '⏹️ إيقاف';
                readBtn.classList.add('stopped');
                readBtn.disabled = false;
                isSpeaking = true;
                isPaused = false;
            }

            // دالة تحميل الأصوات
            function loadVoices() {
                try {
                    voices = window.speechSynthesis.getVoices();
                    
                    // تصفية الأصوات العربية أولاً
                    const arabicVoices = voices.filter(v => v.lang.startsWith('ar'));
                    const otherVoices = voices.filter(v => !v.lang.startsWith('ar'));
                    
                    // ترتيب الأصوات: العربية أولاً ثم الباقي
                    const sortedVoices = [...arabicVoices, ...otherVoices];
                    
                    if (sortedVoices.length === 0) {
                        voiceSelect.innerHTML = '<option value="">لا توجد أصوات متاحة</option>';
                        setStatus('⚠️ لا توجد أصوات متاحة في جهازك', 'warning');
                        return;
                    }

                    voiceSelect.innerHTML = '';
                    let hasArabic = false;
                    
                    sortedVoices.forEach((voice, index) => {
                        const option = document.createElement('option');
                        option.value = index;
                        const langName = voice.lang || 'unknown';
                        const voiceName = voice.name || 'Unnamed';
                        option.textContent = `${voiceName} (${langName})`;
                        
                        // اختيار أول صوت عربي تلقائياً
                        if (voice.lang.startsWith('ar') && !hasArabic) {
                            option.selected = true;
                            hasArabic = true;
                        }
                        
                        voiceSelect.appendChild(option);
                    });

                    // إذا لم يتم العثور على صوت عربي، اختر الأول
                    if (!hasArabic && sortedVoices.length > 0) {
                        voiceSelect.options[0].selected = true;
                        setStatus('⚠️ لم يتم العثور على صوت عربي، سيتم استخدام الصوت الافتراضي', 'warning');
                    } else if (hasArabic) {
                        setStatus('✅ تم تحميل الأصوات العربية بنجاح', 'success');
                    }
                } catch (e) {
                    console.error('خطأ في تحميل الأصوات:', e);
                }
            }

            // تحميل الأصوات عند تغييرها (مهم لكروم)
            if (window.speechSynthesis.onvoiceschanged !== undefined) {
                window.speechSynthesis.onvoiceschanged = loadVoices;
            }

            // محاولة تحميل الأصوات فوراً
            setTimeout(loadVoices, 100);

            // محاولة إضافية بعد ثانية
            setTimeout(loadVoices, 1000);

            // التحقق من دعم التطبيق
            if (!('speechSynthesis' in window)) {
                setStatus('❌ متصفحك لا يدعم خاصية تحويل النص إلى كلام', 'error');
                readBtn.disabled = true;
                return;
            }

            // دالة قراءة النص
            function speakText() {
                const text = textInput.value.trim();
                
                // التحقق من وجود نص
                if (!text) {
                    setStatus('⚠️ الرجاء إدخال نص للقراءة', 'error');
                    return;
                }

                // إلغاء أي قراءة سابقة بأمان
                try {
                    if (window.speechSynthesis.speaking || isSpeaking) {
                        window.speechSynthesis.cancel();
                    }
                } catch (e) {
                    // تجاهل
                }

                // إنشاء كائن الكلام
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = parseFloat(speedSlider.value);
                utterance.pitch = parseFloat(pitchSlider.value);
                utterance.volume = 1;

                // تعيين الصوت المختار
                try {
                    const selectedIndex = parseInt(voiceSelect.value);
                    if (!isNaN(selectedIndex) && voices[selectedIndex]) {
                        utterance.voice = voices[selectedIndex];
                    } else {
                        // محاولة العثور على صوت عربي تلقائياً
                        const arabicVoice = voices.find(v => v.lang.startsWith('ar'));
                        if (arabicVoice) {
                            utterance.voice = arabicVoice;
                        }
                    }
                } catch (e) {
                    // تجاهل
                }

                currentUtterance = utterance;

                // أحداث التطبيق
                utterance.onstart = function() {
                    setStatus('🔊 جاري القراءة...', 'info');
                    setStopButton();
                };

                utterance.onend = function() {
                    setStatus('✅ انتهت القراءة بنجاح', 'success');
                    resetButton();
                };

                utterance.onerror = function(event) {
                    // تجاهل أخطاء الإيقاف المتعمد
                    if (event.error === 'interrupted' || event.error === 'canceled') {
                        setStatus('⏹️ تم إيقاف القراءة', 'info');
                        resetButton();
                        return;
                    }

                    // أخطاء خاصة بالأندرويد
                    if (event.error === 'synthesis-failed' || event.error === 'audio-busy') {
                        setStatus('⚠️ فشل التشغيل. حاول مرة أخرى أو اختر صوتاً مختلفاً', 'warning');
                        resetButton();
                        return;
                    }

                    let errorMsg = '❌ حدث خطأ: ';
                    switch(event.error) {
                        case 'not-allowed':
                            errorMsg += 'الرجاء السماح للتطبيق باستخدام الصوت';
                            break;
                        case 'synthesis-unavailable':
                            errorMsg += 'خدمة الترجمة الصوتية غير متوفرة حالياً';
                            break;
                        default:
                            errorMsg += event.error;
                    }
                    setStatus(errorMsg, 'error');
                    resetButton();
                };

                // محاولة القراءة
                try {
                    window.speechSynthesis.speak(utterance);
                } catch (e) {
                    setStatus('❌ خطأ غير متوقع: ' + e.message, 'error');
                    resetButton();
                }
            }

            // دالة إيقاف القراءة الآمنة
            function stopSpeaking() {
                try {
                    if (window.speechSynthesis.speaking) {
                        window.speechSynthesis.cancel();
                    }
                } catch (e) {
                    // تجاهل
                }
                setStatus('⏹️ تم الإيقاف', 'info');
                resetButton();
            }

            // معالج واحد للزر
            readBtn.addEventListener('click', function(e) {
                e.preventDefault();
                
                if (readBtn.disabled) return;

                // إذا كان في حالة إيقاف
                if (isSpeaking) {
                    stopSpeaking();
                    return;
                }

                // وإلا اقرأ
                speakText();
            });

            // إعادة تحميل الأصوات عند النقر على زر الصوت
            voiceSelect.addEventListener('focus', function() {
                loadVoices();
            });

            // معالجة مشكلة الخروج من المتصفح على الأندرويد
            // منع الأحداث التي قد تسبب الخروج
            document.addEventListener('touchstart', function(e) {
                // منع انتشار الأحداث غير المرغوب فيها
            }, { passive: true });

            // إعادة تعيين الحالة عند فقدان التركيز
            window.addEventListener('beforeunload', function() {
                try {
                    if (window.speechSynthesis.speaking) {
                        window.speechSynthesis.cancel();
                    }
                } catch (e) {}
            });

            // معالجة حالة الخلفية للأندرويد
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    // في الخلفية - لا تفعل شيئاً
                } else {
                    // العودة إلى التطبيق - تحقق من حالة الصوت
                    setTimeout(function() {
                        if (isSpeaking && !window.speechSynthesis.speaking) {
                            resetButton();
                            setStatus('⏹️ توقفت القراءة تلقائياً', 'info');
                        }
                    }, 500);
                }
            });

            // معالجة خاصة لأندرويد 11: استخدام مستمع للصوت
            // لتجنب مشكلة الخروج من المتصفح
            if (/Android/i.test(navigator.userAgent)) {
                // إضافة معالج خاص للأندرويد
                document.addEventListener('click', function(e) {
                    // منع أي إجراء قد يغلق المتصفح
                }, { passive: true });
                
                // منع التمرير الذي قد يسبب مشاكل
                document.addEventListener('touchmove', function(e) {
                    // لا تفعل شيئاً
                }, { passive: true });
            }

            console.log('✅ قارئ النص جاهز للعمل');
        })();
    </script>
</body>
</html>
