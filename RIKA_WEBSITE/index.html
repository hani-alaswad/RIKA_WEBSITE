<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تعرف صوت - منطق مصحح</title>
</head>
<body>
    <button id="btnMic">🎤 تسجيل</button>
    <div id="divStatus">جاهز</div>
    <div id="divText"></div>
    <div id="divError"></div>
    <div id="divVolume">الصوت: 0</div>

    <script>
        // ============================================================
        // 1. المتغيرات العامة
        // ============================================================
        let recognizer = null;
        let isListening = false;
        let fullText = '';        // النص التراكمي (يظهر أثناء الكلام)
        let finalResult = '';     // النتيجة النهائية (تظهر بعد التوقف)
        let audioCtx = null;
        let analyser = null;
        let stream = null;
        let volumeLevel = 0;

        // ============================================================
        // 2. عناصر الواجهة
        // ============================================================
        const btnMic = document.getElementById('btnMic');
        const divStatus = document.getElementById('divStatus');
        const divText = document.getElementById('divText');
        const divError = document.getElementById('divError');
        const divVolume = document.getElementById('divVolume');

        // ============================================================
        // 3. دوال العرض
        // ============================================================
        function showError(msg) {
            divError.textContent = '⚠️ ' + msg;
            console.error(msg);
        }

        function setStatus(msg) {
            divStatus.textContent = msg;
            console.log(msg);
        }

        function showText(text) {
            divText.textContent = text || '';
        }

        function showVolume(level) {
            divVolume.textContent = '🔊 الصوت: ' + level + '/10';
        }

        // ============================================================
        // 4. دوال التحكم الرئيسية
        // ============================================================
        function startListening() {
            if (isListening) {
                showError('الاستماع قيد التشغيل بالفعل');
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showError('المتصفح لا يدعم التعرف على الصوت');
                return;
            }

            recognizer = new SpeechRecognition();
            recognizer.lang = 'ar-SA';
            recognizer.continuous = true;
            recognizer.interimResults = true;

            recognizer.onstart = onStart;
            recognizer.onend = onEnd;
            recognizer.onresult = onResult;
            recognizer.onerror = onError;

            try {
                recognizer.start();
                setStatus('⏳ جاري بدء الاستماع...');
            } catch (e) {
                showError('فشل بدء الاستماع: ' + e.message);
            }
        }

        function stopListening() {
            if (!isListening) {
                showError('الاستماع متوقف بالفعل');
                return;
            }

            try {
                recognizer.stop();
                setStatus('⏹️ جاري الإيقاف...');
            } catch (e) {
                showError('فشل إيقاف الاستماع: ' + e.message);
            }
        }

        function toggleListening() {
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        }

        // ============================================================
        // 5. دوال الأحداث (المنطق الرئيسي المُصحح)
        // ============================================================

        // 5.1 عند بدء الاستماع
        function onStart() {
            isListening = true;
            btnMic.textContent = '⏹️ إيقاف';
            setStatus('🔴 جاري الاستماع...');
            
            // مسح كل شيء عند البدء
            fullText = '';
            finalResult = '';
            showText('');
            
            startVolumeMonitor();
        }

        // 5.2 عند انتهاء الاستماع
        function onEnd() {
            isListening = false;
            btnMic.textContent = '🎤 تسجيل';
            setStatus('⏸️ متوقف');
            stopVolumeMonitor();
        }

        // 5.3 ⭐⭐⭐ المنطق المُصحح لمعالجة النص ⭐⭐⭐
        function onResult(event) {
            let interimText = '';   // النص المؤقت (أثناء الكلام)
            let finalText = '';     // النص النهائي (بعد التوقف)

            // تجميع النتائج
            for (let i = event.resultIndex; i < event.results.length; i++) {
                const text = event.results[i][0].transcript.trim();
                
                if (event.results[i].isFinal) {
                    // ✅ النص النهائي (توقف المستخدم عن الكلام)
                    finalText = text;
                } else {
                    // ✅ النص المؤقت (أثناء الكلام)
                    interimText = text;
                }
            }

            // ============================================================
            // المنطق الجديد:
            // 1. أثناء الكلام: نضيف الكلمات الجديدة إلى النص التراكمي
            // 2. بعد التوقف: نعرض النتيجة النهائية ونحذف التراكمي
            // ============================================================

            if (interimText) {
                // ✅ حالة 1: المستخدم يتكلم (نص مؤقت)
                // نضيف الكلمة الجديدة إلى النص التراكمي
                if (fullText) {
                    fullText += ' ' + interimText;
                } else {
                    fullText = interimText;
                }
                
                // نعرض النص التراكمي فوراً
                showText(fullText);
                
                // نعيد تعيين finalResult لأننا لا نزال في وضع الكلام
                finalResult = '';
                
            } else if (finalText) {
                // ✅ حالة 2: المستخدم توقف عن الكلام (نص نهائي)
                // النتيجة النهائية هي النص الكامل
                finalResult = finalText;
                
                // ⭐ نمسح النص التراكمي
                fullText = '';
                
                // ⭐ نعرض النتيجة النهائية فقط
                showText(finalResult);
                
                // تحديث الحالة
                setStatus('✅ تم التعرف على: "' + finalResult + '"');
            }
        }

        // 5.4 معالجة الأخطاء
        function onError(event) {
            const errors = {
                'not-allowed': 'تم رفض إذن الميكروفون',
                'no-speech': 'لم يتم سماع صوت',
                'audio-capture': 'مشكلة في الميكروفون',
                'network': 'مشكلة في الإنترنت',
                'aborted': 'تم الإيقاف'
            };
            const msg = errors[event.error] || 'خطأ: ' + event.error;
            showError(msg);
            setStatus('❌ ' + msg);

            if (['not-allowed', 'audio-capture'].includes(event.error)) {
                if (isListening) {
                    try { recognizer.stop(); } catch (e) {}
                }
            }
        }

        // ============================================================
        // 6. دوال قياس الصوت (نفسها دون تغيير)
        // ============================================================
        async function startVolumeMonitor() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: false, noiseSuppression: false }
                });

                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.8;

                const source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);

                updateVolume();
            } catch (e) {
                showError('لا يمكن قياس الصوت: ' + e.message);
            }
        }

        function stopVolumeMonitor() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            if (audioCtx && audioCtx.state !== 'closed') {
                audioCtx.close();
                audioCtx = null;
            }
            volumeLevel = 0;
            showVolume(0);
        }

        function updateVolume() {
            if (!analyser || !isListening) {
                return;
            }

            try {
                const data = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(data);

                let sum = 0;
                for (let i = 0; i < data.length; i++) {
                    sum += data[i];
                }
                const avg = sum / data.length;
                const level = Math.min(10, Math.floor((avg / 20) * 1.5));
                volumeLevel = Math.max(0, Math.min(10, level));

                showVolume(volumeLevel);
                requestAnimationFrame(updateVolume);
            } catch (e) {
                showError('خطأ في قياس الصوت: ' + e.message);
            }
        }

        // ============================================================
        // 7. دوال الوصول (Getters)
        // ============================================================
        function getVolumeLevel() { return volumeLevel; }
        function getFinalText() { return finalResult; }
        function getCurrentDisplayText() { return divText.textContent; }

        // ============================================================
        // 8. ربط الأحداث
        // ============================================================
        btnMic.addEventListener('click', toggleListening);

        // ============================================================
        // 9. بداية التشغيل
        // ============================================================
        setStatus('✅ جاهز - اضغط على زر التسجيل');
        showVolume(0);
    </script>
</body>
</html>
