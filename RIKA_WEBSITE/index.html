<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعرف صوت - بسيط 1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        .volume {
            font-size: 20px;
            margin-bottom: 30px;
            color: #aaa;
        }
        .volume-bar {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 10px;
            margin-top: 5px;
            overflow: hidden;
        }
        .volume-bar-inner {
            height: 100%;
            width: 0%;
            background: #4caf50;
            transition: width 0.05s;
            border-radius: 10px;
        }
        button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            font-size: 36px;
            cursor: pointer;
            background: #4caf50;
            color: white;
            transition: 0.3s;
            margin: 10px auto 25px;
        }
        button:hover { transform: scale(1.05); }
        button.listening { background: #f44336; animation: pulse 1s infinite; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        #text-box {
            background: #222;
            border-radius: 12px;
            padding: 20px;
            min-height: 100px;
            font-size: 24px;
            line-height: 1.8;
            text-align: right;
            color: #fff;
            margin-bottom: 20px;
            border: 1px solid #333;
            word-wrap: break-word;
        }
        #text-box:empty::before {
            content: "اضغط على الميكروفون للتحدث...";
            color: #555;
            font-size: 18px;
        }
        #status {
            color: #888;
            font-size: 14px;
            min-height: 25px;
            font-family: monospace;
        }
        #debug {
            color: #ff9800;
            font-size: 12px;
            min-height: 20px;
            font-family: monospace;
            margin-top: 5px;
        }
        @media (max-width: 480px) {
            #text-box { font-size: 20px; padding: 15px; min-height: 80px; }
            button { width: 70px; height: 70px; font-size: 30px; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- مستوى الصوت -->
    <div class="volume">
        <span id="volume-icon">🔇</span> المستوى: <span id="volume-number">0</span> / 10
        <div class="volume-bar"><div class="volume-bar-inner" id="volume-bar"></div></div>
    </div>

    <!-- زر التسجيل -->
    <button id="mic-btn">🎤</button>

    <!-- حقل النص -->
    <div id="text-box"></div>

    <!-- الحالة والأخطاء -->
    <div id="status">⏸️ في انتظار البدء...</div>
    <div id="debug">✅ جاهز</div>
</div>

<script>
    (function() {
        // ----- العناصر -----
        const micBtn = document.getElementById('mic-btn');
        const textBox = document.getElementById('text-box');
        const statusText = document.getElementById('status');
        const debugText = document.getElementById('debug');
        const volumeBar = document.getElementById('volume-bar');
        const volumeNumber = document.getElementById('volume-number');
        const volumeIcon = document.getElementById('volume-icon');

        let isListening = false;
        let recognition = null;
        let fullText = '';           // النص الكامل المتراكم

        // ----- التحقق من الدعم -----
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            statusText.textContent = '❌ المتصفح غير مدعوم';
            debugText.textContent = '❌ يرجى استخدام Chrome';
            micBtn.disabled = true;
            return;
        }

        // ----- وظيفة التصحيح -----
        function debug(msg) {
            debugText.textContent = msg;
            console.log(msg);
        }

        // ----- إعداد التعرف -----
        function initRecognition() {
            if (recognition) {
                try { recognition.abort(); } catch(e) {}
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;

            // ----- معالجة النتائج -----
            recognition.onresult = (event) => {
                let interimText = '';
                let finalText = '';

                // تجميع النتائج
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript.trim();
                    
                    if (event.results[i].isFinal) {
                        // النص النهائي
                        finalText = transcript;
                    } else {
                        // النص المؤقت
                        interimText = transcript;
                    }
                }

                // ----- تحديث النص الكامل -----
                // إذا كان هناك نص نهائي جديد، نضيفه إلى النص الكامل
                if (finalText) {
                    if (fullText) {
                        fullText += ' ' + finalText;
                    } else {
                        fullText = finalText;
                    }
                }

                // ----- عرض النص في الحقل -----
                // نعرض النص الكامل + النص المؤقت (إن وجد)
                let displayText = fullText;
                if (interimText) {
                    if (displayText) {
                        displayText += ' ' + interimText;
                    } else {
                        displayText = interimText;
                    }
                }

                // تحديث الحقل
                if (displayText.trim()) {
                    textBox.textContent = displayText.trim();
                } else {
                    textBox.textContent = '';
                }

                // تمرير للأسفل
                textBox.scrollTop = textBox.scrollHeight;
            };

            // ----- بدء الاستماع -----
            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                micBtn.textContent = '⏹️';
                statusText.textContent = '🔴 جاري الاستماع...';
                debug('✅ بدأ الاستماع');

                // مسح النص السابق عند بدء تسجيل جديد
                fullText = '';
                textBox.textContent = '';
            };

            // ----- انتهاء الاستماع -----
            recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove('listening');
                micBtn.textContent = '🎤';
                statusText.textContent = '⏸️ متوقف';
                debug('⏹️ توقف الاستماع');
            };

            // ----- الأخطاء -----
            recognition.onerror = (event) => {
                const errors = {
                    'not-allowed': '❌ تم رفض الميكروفون',
                    'no-speech': '🔇 لم يتم سماع صوت',
                    'audio-capture': '❌ مشكلة في الميكروفون',
                    'network': '🌐 مشكلة في الإنترنت',
                    'aborted': '⏹️ تم الإيقاف'
                };
                const msg = errors[event.error] || `⚠️ خطأ: ${event.error}`;
                statusText.textContent = msg;
                debug(`❌ ${msg}`);

                if (['not-allowed', 'audio-capture'].includes(event.error)) {
                    isListening = false;
                    micBtn.classList.remove('listening');
                    micBtn.textContent = '🎤';
                }
            };

            // ----- أحداث إضافية -----
            recognition.onsoundstart = () => {
                statusText.textContent = '🔊 يتم سماع صوت...';
                debug('🔊 صوت');
            };
            recognition.onsoundend = () => {
                if (isListening) statusText.textContent = '🔴 جاري الاستماع...';
                debug('🔇 سكون');
            };
            recognition.onspeechstart = () => {
                statusText.textContent = '🗣️ جاري التعرف...';
                debug('🗣️ كلام');
            };
            recognition.onspeechend = () => {
                if (isListening) statusText.textContent = '🔴 جاري الاستماع...';
                debug('✋ انتهى الكلام');
            };
        }

        // ----- تهيئة -----
        initRecognition();

        // ----- زر الميكروفون -----
        micBtn.addEventListener('click', () => {
            if (!isListening) {
                try {
                    recognition.start();
                } catch (e) {
                    if (e.message.includes('already started')) {
                        recognition.stop();
                        setTimeout(() => {
                            try { recognition.start(); } catch(err) {
                                debug(`❌ فشل: ${err.message}`);
                            }
                        }, 300);
                    } else {
                        debug(`❌ خطأ: ${e.message}`);
                        statusText.textContent = `❌ ${e.message}`;
                    }
                }
            } else {
                try {
                    recognition.stop();
                } catch(e) {
                    debug(`❌ خطأ: ${e.message}`);
                }
            }
        });

        // ----- مستوى الصوت -----
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let animationFrame = null;
        let stream = null;

        async function startVolume() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.8;

                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                updateVolume();
                debug('✅ تم تشغيل مؤشر الصوت');
            } catch(err) {
                debug(`⚠️ لا يمكن قياس الصوت: ${err.message}`);
            }
        }

        function updateVolume() {
            if (!analyser || !isListening) {
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }
                return;
            }

            try {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                let avg = sum / dataArray.length;
                let level = Math.min(10, Math.floor((avg / 20) * 1.5));
                level = Math.max(0, Math.min(10, level));

                const percent = (level / 10) * 100;
                volumeBar.style.width = percent + '%';
                volumeNumber.textContent = level;

                const icons = ['🔇', '🔈', '🔉', '🔊', '📢'];
                volumeIcon.textContent = icons[Math.min(4, Math.floor(level / 2.5))];

                if (level < 2) {
                    volumeBar.style.background = '#4caf50';
                } else if (level < 5) {
                    volumeBar.style.background = '#ffeb3b';
                } else if (level < 8) {
                    volumeBar.style.background = '#ff9800';
                } else {
                    volumeBar.style.background = '#f44336';
                }

                animationFrame = requestAnimationFrame(updateVolume);
            } catch(e) {
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }
            }
        }

        function stopVolume() {
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close();
                audioContext = null;
            }
            volumeBar.style.width = '0%';
            volumeNumber.textContent = '0';
            volumeIcon.textContent = '🔇';
        }

        // ----- ربط مستوى الصوت بالاستماع -----
        const originalOnStart = recognition.onstart;
        recognition.onstart = function() {
            if (originalOnStart) originalOnStart.call(this);
            startVolume();
        };

        const originalOnEnd = recognition.onend;
        recognition.onend = function() {
            if (originalOnEnd) originalOnEnd.call(this);
            stopVolume();
        };

        // ----- تنظيف عند الإغلاق -----
        window.addEventListener('beforeunload', () => {
            if (isListening && recognition) {
                try { recognition.abort(); } catch(e) {}
            }
            stopVolume();
        });

        debug('✅ جاهز - اضغط على الميكروفون');
    })();
</script>
</body>
</html>
