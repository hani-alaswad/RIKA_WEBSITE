<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل الكلام إلى نص - نسخة مستقرة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
            width: 95%;
            max-width: 700px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        h2 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        .volume-container {
            background: rgba(0,0,0,0.4);
            border-radius: 50px;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .volume-bar {
            height: 8px;
            background: linear-gradient(90deg, #00f260, #0575e6, #a855f7);
            border-radius: 50px;
            width: 0%;
            transition: width 0.05s linear;
            box-shadow: 0 0 20px rgba(0, 242, 96, 0.3);
        }
        
        .volume-text {
            color: #aaa;
            font-size: 13px;
            margin-top: 8px;
            font-family: monospace;
        }
        
        .listening-indicator {
            display: none;
            width: 12px;
            height: 12px;
            background: #f5576c;
            border-radius: 50%;
            margin: 10px auto;
            animation: blink 0.8s ease-in-out infinite;
        }
        
        .listening-indicator.active {
            display: block;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.8); }
        }
        
        .mic-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            position: relative;
            margin: 10px auto;
        }
        
        .mic-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.6);
        }
        
        .mic-btn:active {
            transform: scale(0.95);
        }
        
        .mic-btn.listening {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            box-shadow: 0 8px 30px rgba(245, 87, 108, 0.5);
            animation: pulse 1.2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 87, 108, 0.5); }
            50% { box-shadow: 0 0 0 20px rgba(245, 87, 108, 0); }
        }
        
        #result-box {
            margin-top: 25px;
            padding: 20px;
            min-height: 120px;
            max-height: 300px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            color: #e0e0e0;
            text-align: right;
            font-size: 22px;
            line-height: 1.8;
            font-weight: 300;
            transition: all 0.3s;
        }
        
        #result-box:empty::before {
            content: "🎤 اضغط على الميكروفون وابدأ التحدث...";
            color: #666;
            font-size: 16px;
        }
        
        #result-box .word {
            display: inline-block;
            animation: fadeInWord 0.2s ease;
            margin: 0 2px;
        }
        
        #result-box .interim {
            color: #8f8;
            opacity: 0.7;
        }
        
        #result-box .final {
            color: #fff;
        }
        
        @keyframes fadeInWord {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        #status {
            color: #888;
            font-size: 14px;
            margin-top: 15px;
            font-family: monospace;
        }
        
        #debug-info {
            color: #ffaa00;
            font-size: 12px;
            margin-top: 10px;
            font-family: monospace;
            min-height: 40px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
            text-align: left;
            direction: ltr;
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .status-ok { color: #4caf50; }
        .status-error { color: #f44336; }
        .status-warning { color: #ff9800; }
        
        @media (max-width: 480px) {
            .container { padding: 20px; }
            h2 { font-size: 20px; }
            .mic-btn { width: 80px; height: 80px; font-size: 32px; }
            #result-box { font-size: 18px; min-height: 80px; padding: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎙️ تحويل الكلام إلى نص - نسخة مستقرة</h2>
    
    <div class="volume-container">
        <div class="volume-bar" id="volumeBar"></div>
    </div>
    <div class="volume-text" id="volumeText">🔇 المستوى: 0 / 10</div>
    
    <div class="listening-indicator" id="indicator"></div>
    
    <button class="mic-btn" id="micBtn">🎤</button>
    
    <div id="status">⏸️ في انتظار البدء...</div>
    
    <div id="result-box"></div>
    
    <div id="debug-info">✅ جاهز للاستخدام</div>
</div>

<script>
    (function() {
        // --- العناصر ---
        const micBtn = document.getElementById('micBtn');
        const resultBox = document.getElementById('result-box');
        const statusText = document.getElementById('status');
        const debugInfo = document.getElementById('debug-info');
        const volumeBar = document.getElementById('volumeBar');
        const volumeText = document.getElementById('volumeText');
        const indicator = document.getElementById('indicator');
        
        let isListening = false;
        let recognition = null;
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let animationFrame = null;
        let stream = null;
        let finalTranscript = '';
        let lastFinalTranscript = '';
        let isProcessingResult = false;
        let recognitionStartTime = 0;
        
        // --- التحقق من الدعم ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            statusText.textContent = '❌ متصفحك لا يدعم خاصية التعرف على الصوت';
            debugInfo.textContent = '❌ خطأ: المتصفح غير مدعوم';
            micBtn.disabled = true;
            return;
        }
        
        // --- دالة لتحديث حالة التصحيح ---
        function updateDebug(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const colors = {
                'info': '#4caf50',
                'error': '#f44336',
                'warning': '#ff9800',
                'success': '#4caf50'
            };
            debugInfo.innerHTML = `<span style="color: ${colors[type] || '#fff'}">[${timestamp}] ${message}</span>`;
            console.log(`[${timestamp}] ${message}`);
        }
        
        // --- إعداد التعرف المحسن ---
        function initRecognition() {
            if (recognition) {
                try {
                    recognition.abort();
                } catch (e) {}
            }
            
            recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;
            
            // --- معالجة النتائج بدون تكرار ---
            recognition.onresult = (event) => {
                if (isProcessingResult) return;
                isProcessingResult = true;
                
                try {
                    let interimTranscript = '';
                    let newFinalText = '';
                    
                    // تجميع النتائج الجديدة فقط
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript.trim();
                        
                        if (event.results[i].isFinal) {
                            // نضيف فقط إذا كان مختلفاً عن آخر نص نهائي
                            if (transcript && transcript !== lastFinalTranscript) {
                                newFinalText += transcript + ' ';
                                lastFinalTranscript = transcript;
                            }
                        } else {
                            interimTranscript += transcript + ' ';
                        }
                    }
                    
                    // تحديث النص النهائي
                    if (newFinalText) {
                        finalTranscript += newFinalText;
                        updateDebug(`تم إضافة نص نهائي: "${newFinalText.trim()}"`, 'success');
                    }
                    
                    // عرض النص الكامل
                    let displayText = finalTranscript + interimTranscript;
                    
                    if (displayText.trim()) {
                        // تقسيم إلى كلمات مع تمييز
                        const parts = [];
                        const finalWords = finalTranscript.trim().split(' ');
                        const interimWords = interimTranscript.trim().split(' ');
                        
                        finalWords.forEach(word => {
                            if (word) parts.push(`<span class="word final">${word}</span>`);
                        });
                        
                        interimWords.forEach(word => {
                            if (word) parts.push(`<span class="word interim">${word}</span>`);
                        });
                        
                        resultBox.innerHTML = parts.join(' ');
                    } else {
                        resultBox.innerHTML = '';
                    }
                    
                    resultBox.scrollTop = resultBox.scrollHeight;
                    
                } catch (e) {
                    updateDebug(`خطأ في معالجة النتيجة: ${e.message}`, 'error');
                } finally {
                    isProcessingResult = false;
                }
            };
            
            // --- عند بدء الاستماع ---
            recognition.onstart = () => {
                isListening = true;
                recognitionStartTime = Date.now();
                micBtn.classList.add('listening');
                micBtn.textContent = '⏹️';
                indicator.classList.add('active');
                statusText.textContent = '🔴 جاري الاستماع...';
                finalTranscript = '';
                lastFinalTranscript = '';
                updateDebug('✅ بدأ الاستماع بنجاح', 'success');
                
                startVolumeMonitoring();
            };
            
            // --- عند انتهاء الاستماع ---
            recognition.onend = () => {
                const duration = ((Date.now() - recognitionStartTime) / 1000).toFixed(1);
                isListening = false;
                micBtn.classList.remove('listening');
                micBtn.textContent = '🎤';
                indicator.classList.remove('active');
                statusText.textContent = `⏸️ توقف (${duration} ثانية)`;
                
                stopVolumeMonitoring();
                updateDebug(`⏹️ توقف الاستماع بعد ${duration} ثانية`, 'warning');
            };
            
            // --- معالجة الأخطاء بالتفصيل ---
            recognition.onerror = (event) => {
                const errorMessages = {
                    'not-allowed': '❌ تم رفض إذن الميكروفون - امنح الصلاحية من المتصفح',
                    'no-speech': '🔇 لم يتم سماع صوت - تأكد من الميكروفون وتحدث بصوت أعلى',
                    'audio-capture': '❌ لا يمكن الوصول للميكروفون - تأكد من توصيله',
                    'network': '🌐 مشكلة في الشبكة - تأكد من اتصال الإنترنت',
                    'service-not-allowed': '❌ الخدمة غير مسموحة - تحقق من إعدادات المتصفح',
                    'aborted': '⏹️ تم إيقاف الاستماع يدوياً',
                    'language-not-supported': '⚠️ اللغة غير مدعومة بالكامل',
                    'bad-grammar': '⚠️ خطأ في بناء الجملة'
                };
                
                const message = errorMessages[event.error] || `⚠️ خطأ غير معروف: ${event.error}`;
                statusText.textContent = message;
                updateDebug(message, 'error');
                
                // محاولة إعادة التشغيل في بعض الحالات
                if (event.error === 'no-speech' && isListening) {
                    updateDebug('🔄 محاولة إعادة الاستماع...', 'warning');
                    setTimeout(() => {
                        try {
                            if (recognition && isListening) {
                                recognition.stop();
                                setTimeout(() => {
                                    try {
                                        recognition.start();
                                        updateDebug('✅ تم إعادة التشغيل', 'success');
                                    } catch (e) {
                                        updateDebug(`❌ فشل إعادة التشغيل: ${e.message}`, 'error');
                                    }
                                }, 300);
                            }
                        } catch (e) {
                            updateDebug(`❌ خطأ في إعادة التشغيل: ${e.message}`, 'error');
                        }
                    }, 500);
                }
                
                // إذا كان خطأ فادح، نوقف كل شيء
                if (['not-allowed', 'audio-capture', 'service-not-allowed'].includes(event.error)) {
                    isListening = false;
                    micBtn.classList.remove('listening');
                    micBtn.textContent = '🎤';
                    indicator.classList.remove('active');
                    stopVolumeMonitoring();
                }
            };
            
            // --- تحسين حساسية الصوت ---
            recognition.onaudioend = () => {
                updateDebug('🎤 انتهى التقاط الصوت', 'info');
            };
            
            recognition.onaudiostart = () => {
                updateDebug('🎤 بدأ التقاط الصوت', 'info');
            };
            
            recognition.onsoundstart = () => {
                updateDebug('🔊 تم اكتشاف صوت', 'success');
                statusText.textContent = '🔊 يتم سماع صوتك...';
            };
            
            recognition.onsoundend = () => {
                updateDebug('🔇 انتهى الصوت', 'info');
                if (isListening) {
                    statusText.textContent = '🔴 جاري الاستماع... (تحدث)';
                }
            };
            
            recognition.onspeechstart = () => {
                updateDebug('🗣️ بدأ الكلام', 'success');
                statusText.textContent = '🗣️ جاري التعرف على الكلام...';
            };
            
            recognition.onspeechend = () => {
                updateDebug('✋ انتهى الكلام', 'info');
                if (isListening) {
                    statusText.textContent = '🔴 جاري الاستماع...';
                }
            };
        }
        
        // --- تهيئة التعرف ---
        initRecognition();
        
        // --- زر الميكروفون ---
        micBtn.addEventListener('click', () => {
            if (!isListening) {
                try {
                    if (!recognition) {
                        initRecognition();
                    }
                    // إعادة تعيين النص السابق
                    finalTranscript = '';
                    lastFinalTranscript = '';
                    resultBox.innerHTML = '';
                    recognition.start();
                    updateDebug('🎤 بدأ التسجيل', 'success');
                } catch (e) {
                    const errorMsg = e.message || 'خطأ غير معروف';
                    updateDebug(`❌ خطأ في بدء التسجيل: ${errorMsg}`, 'error');
                    statusText.textContent = `❌ خطأ: ${errorMsg}`;
                    
                    // إذا كان الخطأ بسبب بدء التشغيل مرتين
                    if (errorMsg.includes('already started')) {
                        try {
                            recognition.stop();
                            setTimeout(() => {
                                try {
                                    recognition.start();
                                    updateDebug('✅ تم إعادة التشغيل بنجاح', 'success');
                                } catch (err) {
                                    updateDebug(`❌ فشل إعادة التشغيل: ${err.message}`, 'error');
                                }
                            }, 300);
                        } catch (err) {
                            updateDebug(`❌ خطأ في الإيقاف: ${err.message}`, 'error');
                        }
                    }
                }
            } else {
                try {
                    recognition.stop();
                    updateDebug('⏹️ تم إيقاف التسجيل يدوياً', 'warning');
                } catch (e) {
                    updateDebug(`❌ خطأ في إيقاف التسجيل: ${e.message}`, 'error');
                }
            }
        });
        
        // --- تحسين مستوى الصوت ---
        async function startVolumeMonitoring() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;
                analyser.smoothingTimeConstant = 0.8;
                
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                updateDebug('✅ تم تشغيل مؤشر الصوت', 'success');
                
                updateVolume();
            } catch (err) {
                updateDebug(`⚠️ لا يمكن قياس الصوت: ${err.message}`, 'warning');
                volumeText.textContent = '⚠️ لا يمكن قياس المستوى';
            }
        }
        
        function updateVolume() {
            if (!analyser || !isListening) {
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }
                return;
            }
            
            try {
                analyser.getByteFrequencyData(dataArray);
                
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                let average = sum / dataArray.length;
                
                // تحسين حساسية الصوت
                let level = Math.min(10, Math.floor((average / 20) * 1.5));
                level = Math.max(0, Math.min(10, level));
                
                const percent = (level / 10) * 100;
                volumeBar.style.width = percent + '%';
                
                const icons = ['🔇', '🔈', '🔉', '🔊', '📢'];
                let iconIndex = Math.min(4, Math.floor(level / 2.5));
                volumeText.textContent = `${icons[iconIndex]} المستوى: ${level} / 10`;
                
                if (level < 2) {
                    volumeBar.style.background = 'linear-gradient(90deg, #4caf50, #8bc34a)';
                } else if (level < 5) {
                    volumeBar.style.background = 'linear-gradient(90deg, #ffeb3b, #ff9800)';
                } else if (level < 8) {
                    volumeBar.style.background = 'linear-gradient(90deg, #ff9800, #f44336)';
                } else {
                    volumeBar.style.background = 'linear-gradient(90deg, #f44336, #9c27b0)';
                }
                
                animationFrame = requestAnimationFrame(updateVolume);
            } catch (e) {
                updateDebug(`⚠️ خطأ في قياس الصوت: ${e.message}`, 'warning');
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }
            }
        }
        
        function stopVolumeMonitoring() {
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
            
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close();
                audioContext = null;
            }
            
            volumeBar.style.width = '0%';
            volumeText.textContent = '🔇 المستوى: 0 / 10';
        }
        
        // --- تنظيف عند الإغلاق ---
        window.addEventListener('beforeunload', () => {
            if (isListening && recognition) {
                try { recognition.abort(); } catch (e) {}
            }
            stopVolumeMonitoring();
        });
        
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isListening) {
                if (recognition) {
                    try { recognition.stop(); } catch (e) {}
                }
            }
        });
        
        updateDebug('✅ التطبيق جاهز للاستخدام - استخدم الميكروفون للتعرف على الكلام', 'success');
    })();
</script>

</body>
</html>
