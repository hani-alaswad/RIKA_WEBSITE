<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل الكلام إلى نص - عرض فوري</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
            width: 95%;
            max-width: 700px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        h2 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        .volume-container {
            background: rgba(0,0,0,0.4);
            border-radius: 50px;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .volume-bar {
            height: 8px;
            background: linear-gradient(90deg, #00f260, #0575e6, #a855f7);
            border-radius: 50px;
            width: 0%;
            transition: width 0.05s linear;
            box-shadow: 0 0 20px rgba(0, 242, 96, 0.3);
        }
        
        .volume-text {
            color: #aaa;
            font-size: 13px;
            margin-top: 8px;
            font-family: monospace;
        }
        
        .listening-indicator {
            display: none;
            width: 12px;
            height: 12px;
            background: #f5576c;
            border-radius: 50%;
            margin: 10px auto;
            animation: blink 0.8s ease-in-out infinite;
        }
        
        .listening-indicator.active {
            display: block;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.8); }
        }
        
        .mic-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            position: relative;
            margin: 10px auto;
        }
        
        .mic-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.6);
        }
        
        .mic-btn:active {
            transform: scale(0.95);
        }
        
        .mic-btn.listening {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            box-shadow: 0 8px 30px rgba(245, 87, 108, 0.5);
            animation: pulse 1.2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 87, 108, 0.5); }
            50% { box-shadow: 0 0 0 20px rgba(245, 87, 108, 0); }
        }
        
        .result-sections {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .section {
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 15px 20px;
            border: 1px solid rgba(255,255,255,0.08);
            text-align: right;
        }
        
        .section-title {
            color: #888;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            text-align: right;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .section-title .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-right: 8px;
        }
        
        .badge-live {
            background: #4caf50;
            color: #fff;
        }
        
        .badge-final {
            background: #2196f3;
            color: #fff;
        }
        
        #live-text {
            color: #8f8;
            font-size: 20px;
            line-height: 1.8;
            min-height: 50px;
            font-weight: 300;
        }
        
        #live-text:empty::before {
            content: "⏳ في انتظار الكلام...";
            color: #666;
            font-size: 16px;
        }
        
        #final-text {
            color: #fff;
            font-size: 22px;
            line-height: 1.8;
            min-height: 50px;
            font-weight: 400;
        }
        
        #final-text:empty::before {
            content: "📝 النتيجة النهائية ستظهر هنا...";
            color: #666;
            font-size: 16px;
        }
        
        #status {
            color: #888;
            font-size: 13px;
            margin-top: 15px;
            font-family: monospace;
        }
        
        #debug-info {
            color: #ffaa00;
            font-size: 11px;
            margin-top: 10px;
            font-family: monospace;
            min-height: 30px;
            background: rgba(0,0,0,0.3);
            padding: 8px 12px;
            border-radius: 8px;
            text-align: left;
            direction: ltr;
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .clear-btn {
            background: rgba(255,255,255,0.1);
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 5px 15px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }
        
        .clear-btn:hover {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }
        
        @media (max-width: 480px) {
            .container { padding: 20px; }
            h2 { font-size: 20px; }
            .mic-btn { width: 80px; height: 80px; font-size: 32px; }
            #live-text { font-size: 17px; }
            #final-text { font-size: 19px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎙️ تحويل الكلام إلى نص فوري</h2>
    
    <div class="volume-container">
        <div class="volume-bar" id="volumeBar"></div>
    </div>
    <div class="volume-text" id="volumeText">🔇 المستوى: 0 / 10</div>
    
    <div class="listening-indicator" id="indicator"></div>
    
    <button class="mic-btn" id="micBtn">🎤</button>
    
    <div id="status">⏸️ في انتظار البدء...</div>
    
    <div class="result-sections">
        <div class="section">
            <div class="section-title">
                <span class="badge badge-live">● مباشر</span>
                الكلمات أثناء التحدث
            </div>
            <div id="live-text"></div>
        </div>
        
        <div class="section">
            <div class="section-title">
                <span class="badge badge-final">✓ نهائي</span>
                النتيجة النهائية
                <button class="clear-btn" id="clearBtn">🗑️ مسح</button>
            </div>
            <div id="final-text"></div>
        </div>
    </div>
    
    <div id="debug-info">✅ جاهز للاستخدام</div>
</div>

<script>
    (function() {
        // --- العناصر ---
        const micBtn = document.getElementById('micBtn');
        const liveText = document.getElementById('live-text');
        const finalText = document.getElementById('final-text');
        const statusText = document.getElementById('status');
        const debugInfo = document.getElementById('debug-info');
        const volumeBar = document.getElementById('volumeBar');
        const volumeText = document.getElementById('volumeText');
        const indicator = document.getElementById('indicator');
        const clearBtn = document.getElementById('clearBtn');
        
        let isListening = false;
        let recognition = null;
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let animationFrame = null;
        let stream = null;
        
        // تخزين النص النهائي
        let finalTranscript = '';
        let currentInterim = '';
        let lastFinalWord = '';
        
        // --- التحقق من الدعم ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            statusText.textContent = '❌ متصفحك لا يدعم خاصية التعرف على الصوت';
            debugInfo.textContent = '❌ خطأ: المتصفح غير مدعوم';
            micBtn.disabled = true;
            return;
        }
        
        // --- دالة تحديث التصحيح ---
        function updateDebug(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const colors = {
                'info': '#4caf50',
                'error': '#f44336',
                'warning': '#ff9800',
                'success': '#4caf50'
            };
            debugInfo.innerHTML = `<span style="color: ${colors[type] || '#fff'}">[${timestamp}] ${message}</span>`;
            console.log(`[${timestamp}] ${message}`);
        }
        
        // --- إعداد التعرف ---
        function initRecognition() {
            if (recognition) {
                try {
                    recognition.abort();
                } catch (e) {}
            }
            
            recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;
            
            // --- معالجة النتائج - عرض فوري بدون تكرار ---
            recognition.onresult = (event) => {
                let interim = '';
                let final = '';
                
                // معالجة جميع النتائج الجديدة
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript.trim();
                    
                    if (event.results[i].isFinal) {
                        // نص نهائي - نضيفه إلى النص النهائي إذا كان جديداً
                        if (transcript && transcript !== lastFinalWord) {
                            final += transcript + ' ';
                            lastFinalWord = transcript;
                        }
                    } else {
                        // نص مؤقت - نعرضه فوراً
                        interim += transcript + ' ';
                    }
                }
                
                // تحديث النص النهائي
                if (final) {
                    finalTranscript += final;
                    finalText.textContent = finalTranscript.trim();
                }
                
                // تحديث النص المباشر (يظهر أثناء التحدث)
                if (interim) {
                    liveText.textContent = interim.trim();
                } else {
                    // إذا لم يكن هناك نص مؤقت، نظهر آخر نص نهائي في الحقل المباشر
                    if (final) {
                        liveText.textContent = final.trim();
                    } else if (!finalTranscript) {
                        liveText.innerHTML = '';
                    }
                }
                
                // التمرير للأسفل
                liveText.scrollTop = liveText.scrollHeight;
                finalText.scrollTop = finalText.scrollHeight;
            };
            
            // --- عند بدء الاستماع ---
            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                micBtn.textContent = '⏹️';
                indicator.classList.add('active');
                statusText.textContent = '🔴 جاري الاستماع...';
                updateDebug('✅ بدأ الاستماع بنجاح', 'success');
                
                // مسح النص المؤقت فقط، مع الاحتفاظ بالنص النهائي
                liveText.innerHTML = '';
                currentInterim = '';
                
                startVolumeMonitoring();
            };
            
            // --- عند انتهاء الاستماع ---
            recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove('listening');
                micBtn.textContent = '🎤';
                indicator.classList.remove('active');
                statusText.textContent = '⏸️ متوقف';
                
                // إذا كان هناك نص مؤقت، نضيفه إلى النهائي
                if (liveText.textContent.trim() && liveText.textContent.trim() !== '⏳ في انتظار الكلام...') {
                    const interimText = liveText.textContent.trim();
                    if (interimText && !finalTranscript.includes(interimText)) {
                        finalTranscript += interimText + ' ';
                        finalText.textContent = finalTranscript.trim();
                    }
                }
                
                liveText.innerHTML = '';
                lastFinalWord = '';
                updateDebug('⏹️ توقف الاستماع', 'warning');
                
                stopVolumeMonitoring();
            };
            
            // --- معالجة الأخطاء ---
            recognition.onerror = (event) => {
                const errorMessages = {
                    'not-allowed': '❌ تم رفض إذن الميكروفون',
                    'no-speech': '🔇 لم يتم سماع صوت - تحدث بصوت أعلى',
                    'audio-capture': '❌ لا يمكن الوصول للميكروفون',
                    'network': '🌐 مشكلة في الشبكة',
                    'service-not-allowed': '❌ الخدمة غير مسموحة',
                    'aborted': '⏹️ تم الإيقاف يدوياً'
                };
                
                const message = errorMessages[event.error] || `⚠️ خطأ: ${event.error}`;
                statusText.textContent = message;
                updateDebug(message, 'error');
                
                if (['not-allowed', 'audio-capture', 'service-not-allowed'].includes(event.error)) {
                    isListening = false;
                    micBtn.classList.remove('listening');
                    micBtn.textContent = '🎤';
                    indicator.classList.remove('active');
                    stopVolumeMonitoring();
                }
            };
            
            // --- أحداث إضافية للتصحيح ---
            recognition.onsoundstart = () => {
                statusText.textContent = '🔊 يتم سماع صوتك...';
                updateDebug('🔊 تم اكتشاف صوت', 'success');
            };
            
            recognition.onsoundend = () => {
                if (isListening) {
                    statusText.textContent = '🔴 جاري الاستماع...';
                }
                updateDebug('🔇 انتهى الصوت', 'info');
            };
            
            recognition.onspeechstart = () => {
                statusText.textContent = '🗣️ جاري التعرف...';
                updateDebug('🗣️ بدأ الكلام', 'success');
            };
            
            recognition.onspeechend = () => {
                if (isListening) {
                    statusText.textContent = '🔴 جاري الاستماع...';
                }
                updateDebug('✋ انتهى الكلام', 'info');
            };
        }
        
        // --- تهيئة ---
        initRecognition();
        
        // --- زر الميكروفون ---
        micBtn.addEventListener('click', () => {
            if (!isListening) {
                try {
                    if (!recognition) {
                        initRecognition();
                    }
                    recognition.start();
                    updateDebug('🎤 بدأ التسجيل', 'success');
                } catch (e) {
                    const errorMsg = e.message || 'خطأ غير معروف';
                    updateDebug(`❌ خطأ: ${errorMsg}`, 'error');
                    statusText.textContent = `❌ ${errorMsg}`;
                    
                    if (errorMsg.includes('already started')) {
                        try {
                            recognition.stop();
                            setTimeout(() => {
                                try {
                                    recognition.start();
                                    updateDebug('✅ تم إعادة التشغيل', 'success');
                                } catch (err) {
                                    updateDebug(`❌ فشل إعادة التشغيل: ${err.message}`, 'error');
                                }
                            }, 300);
                        } catch (err) {
                            updateDebug(`❌ خطأ: ${err.message}`, 'error');
                        }
                    }
                }
            } else {
                try {
                    recognition.stop();
                    updateDebug('⏹️ تم الإيقاف يدوياً', 'warning');
                } catch (e) {
                    updateDebug(`❌ خطأ في الإيقاف: ${e.message}`, 'error');
                }
            }
        });
        
        // --- زر مسح النص ---
        clearBtn.addEventListener('click', () => {
            finalTranscript = '';
            finalText.textContent = '';
            liveText.innerHTML = '';
            lastFinalWord = '';
            updateDebug('🗑️ تم مسح النص', 'warning');
        });
        
        // --- تحسين مستوى الصوت ---
        async function startVolumeMonitoring() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;
                analyser.smoothingTimeConstant = 0.8;
                
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                updateDebug('✅ تم تشغيل مؤشر الصوت', 'success');
                
                updateVolume();
            } catch (err) {
                updateDebug(`⚠️ لا يمكن قياس الصوت: ${err.message}`, 'warning');
                volumeText.textContent = '⚠️ لا يمكن قياس المستوى';
            }
        }
        
        function updateVolume() {
            if (!analyser || !isListening) {
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }
                return;
            }
            
            try {
                analyser.getByteFrequencyData(dataArray);
                
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                let average = sum / dataArray.length;
                
                let level = Math.min(10, Math.floor((average / 20) * 1.5));
                level = Math.max(0, Math.min(10, level));
                
                const percent = (level / 10) * 100;
                volumeBar.style.width = percent + '%';
                
                const icons = ['🔇', '🔈', '🔉', '🔊', '📢'];
                let iconIndex = Math.min(4, Math.floor(level / 2.5));
                volumeText.textContent = `${icons[iconIndex]} المستوى: ${level} / 10`;
                
                if (level < 2) {
                    volumeBar.style.background = 'linear-gradient(90deg, #4caf50, #8bc34a)';
                } else if (level < 5) {
                    volumeBar.style.background = 'linear-gradient(90deg, #ffeb3b, #ff9800)';
                } else if (level < 8) {
                    volumeBar.style.background = 'linear-gradient(90deg, #ff9800, #f44336)';
                } else {
                    volumeBar.style.background = 'linear-gradient(90deg, #f44336, #9c27b0)';
                }
                
                animationFrame = requestAnimationFrame(updateVolume);
            } catch (e) {
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }
            }
        }
        
        function stopVolumeMonitoring() {
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
            
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close();
                audioContext = null;
            }
            
            volumeBar.style.width = '0%';
            volumeText.textContent = '🔇 المستوى: 0 / 10';
        }
        
        // --- تنظيف ---
        window.addEventListener('beforeunload', () => {
            if (isListening && recognition) {
                try { recognition.abort(); } catch (e) {}
            }
            stopVolumeMonitoring();
        });
        
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isListening) {
                if (recognition) {
                    try { recognition.stop(); } catch (e) {}
                }
            }
        });
        
        updateDebug('✅ التطبيق جاهز - تحدث وسيظهر النص فوراً', 'success');
    })();
</script>

</body>
</html>
