<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل الكلام إلى نص - فوري ومحلي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
            width: 95%;
            max-width: 700px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        h2 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        /* مستوى الصوت */
        .volume-container {
            background: rgba(0,0,0,0.4);
            border-radius: 50px;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .volume-bar {
            height: 8px;
            background: linear-gradient(90deg, #00f260, #0575e6, #a855f7);
            border-radius: 50px;
            width: 0%;
            transition: width 0.05s linear;
            box-shadow: 0 0 20px rgba(0, 242, 96, 0.3);
        }
        
        .volume-text {
            color: #aaa;
            font-size: 13px;
            margin-top: 8px;
            font-family: monospace;
        }
        
        /* مؤشر الاستماع */
        .listening-indicator {
            display: none;
            width: 12px;
            height: 12px;
            background: #f5576c;
            border-radius: 50%;
            margin: 10px auto;
            animation: blink 0.8s ease-in-out infinite;
        }
        
        .listening-indicator.active {
            display: block;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.8); }
        }
        
        /* زر الميكروفون */
        .mic-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            position: relative;
            margin: 10px auto;
        }
        
        .mic-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.6);
        }
        
        .mic-btn:active {
            transform: scale(0.95);
        }
        
        .mic-btn.listening {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            box-shadow: 0 8px 30px rgba(245, 87, 108, 0.5);
            animation: pulse 1.2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 87, 108, 0.5); }
            50% { box-shadow: 0 0 0 20px rgba(245, 87, 108, 0); }
        }
        
        /* صندوق النص */
        #result-box {
            margin-top: 25px;
            padding: 20px;
            min-height: 120px;
            max-height: 300px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            color: #e0e0e0;
            text-align: right;
            font-size: 22px;
            line-height: 1.8;
            font-weight: 300;
            transition: all 0.3s;
        }
        
        #result-box:empty::before {
            content: "🎤 اضغط على الميكروفون وابدأ التحدث...";
            color: #666;
            font-size: 16px;
        }
        
        #result-box .word {
            display: inline-block;
            animation: fadeInWord 0.2s ease;
            margin: 0 2px;
        }
        
        #result-box .interim {
            color: #8f8;
            opacity: 0.7;
        }
        
        #result-box .final {
            color: #fff;
        }
        
        @keyframes fadeInWord {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        #status {
            color: #888;
            font-size: 13px;
            margin-top: 15px;
            font-family: monospace;
        }
        
        #debug-info {
            color: #666;
            font-size: 11px;
            margin-top: 10px;
            font-family: monospace;
            min-height: 20px;
        }
        
        /* تنسيق الجوال */
        @media (max-width: 480px) {
            .container { padding: 20px; }
            h2 { font-size: 20px; }
            .mic-btn { width: 80px; height: 80px; font-size: 32px; }
            #result-box { font-size: 18px; min-height: 80px; padding: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎙️ تحويل الكلام إلى نص فوري</h2>
    
    <!-- مستوى الصوت -->
    <div class="volume-container">
        <div class="volume-bar" id="volumeBar"></div>
    </div>
    <div class="volume-text" id="volumeText">🔇 المستوى: 0 / 10</div>
    
    <!-- مؤشر الاستماع -->
    <div class="listening-indicator" id="indicator"></div>
    
    <!-- زر الميكروفون -->
    <button class="mic-btn" id="micBtn">🎤</button>
    
    <div id="status">⏸️ في انتظار البدء...</div>
    <div id="debug-info"></div>
    
    <!-- صندوق النص -->
    <div id="result-box"></div>
</div>

<script>
    (function() {
        // --- العناصر ---
        const micBtn = document.getElementById('micBtn');
        const resultBox = document.getElementById('result-box');
        const statusText = document.getElementById('status');
        const debugInfo = document.getElementById('debug-info');
        const volumeBar = document.getElementById('volumeBar');
        const volumeText = document.getElementById('volumeText');
        const indicator = document.getElementById('indicator');
        
        let isListening = false;
        let recognition = null;
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let animationFrame = null;
        let stream = null;
        let finalTranscript = '';
        let restartAttempts = 0;
        let isRestarting = false;
        
        // --- التحقق من الدعم ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            statusText.textContent = '❌ متصفحك لا يدعم خاصية التعرف على الصوت';
            micBtn.disabled = true;
            return;
        }
        
        // --- إعداد التعرف (باستخدام إعدادات الكود القديم المحسنة) ---
        function initRecognition() {
            recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.continuous = true;      // استمرار الاستماع
            recognition.interimResults = true;  // عرض نتائج مؤقتة فورية
            recognition.maxAlternatives = 1;
            
            // --- معالجة النتائج (فورية) ---
            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscriptTemp = finalTranscript;
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    
                    if (event.results[i].isFinal) {
                        finalTranscriptTemp += transcript + ' ';
                        finalTranscript = finalTranscriptTemp;
                    } else {
                        interimTranscript += transcript;
                    }
                }
                
                // عرض النص الفوري مع تمييز بين النهائي والمؤقت
                let displayText = finalTranscript + interimTranscript;
                
                if (displayText.trim()) {
                    // تقسيم النص إلى كلمات وعرضها مع تأثير
                    const parts = [];
                    const finalWords = finalTranscript.trim().split(' ');
                    const interimWords = interimTranscript.trim().split(' ');
                    
                    // إضافة الكلمات النهائية
                    finalWords.forEach(word => {
                        if (word) parts.push(`<span class="word final">${word}</span>`);
                    });
                    
                    // إضافة الكلمات المؤقتة (باللون الأخضر)
                    interimWords.forEach(word => {
                        if (word) parts.push(`<span class="word interim">${word}</span>`);
                    });
                    
                    resultBox.innerHTML = parts.join(' ');
                } else {
                    resultBox.innerHTML = '';
                }
                
                // التمرير للأسفل تلقائياً
                resultBox.scrollTop = resultBox.scrollHeight;
            };
            
            // --- عند بدء الاستماع ---
            recognition.onstart = () => {
                isListening = true;
                isRestarting = false;
                micBtn.classList.add('listening');
                micBtn.textContent = '⏹️';
                indicator.classList.add('active');
                statusText.textContent = '🔴 جاري الاستماع... (تحدث الآن)';
                finalTranscript = '';
                restartAttempts = 0;
                
                // بدء تحليل الصوت لمستوى الضجيج
                startVolumeMonitoring();
            };
            
            // --- عند انتهاء الاستماع ---
            recognition.onend = () => {
                // إذا كنا في وضع إعادة التشغيل، لا نوقف كل شيء
                if (isRestarting) {
                    return;
                }
                
                isListening = false;
                micBtn.classList.remove('listening');
                micBtn.textContent = '🎤';
                indicator.classList.remove('active');
                statusText.textContent = '⏸️ متوقف';
                
                stopVolumeMonitoring();
                
                // إذا لم يكن هناك نص، عرض رسالة
                if (!resultBox.textContent.trim()) {
                    resultBox.innerHTML = '';
                }
            };
            
            // --- معالجة الأخطاء ---
            recognition.onerror = (event) => {
                console.warn('Speech Recognition Error:', event.error);
                
                if (event.error === 'not-allowed') {
                    statusText.textContent = '❌ تم رفض إذن الميكروفون';
                    isListening = false;
                    micBtn.classList.remove('listening');
                    micBtn.textContent = '🎤';
                    indicator.classList.remove('active');
                    stopVolumeMonitoring();
                } else if (event.error === 'no-speech') {
                    // لا نوقف الاستماع، نستمر
                    statusText.textContent = '🔇 لم يتم سماع صوت، استمر في التحدث...';
                } else if (event.error === 'audio-capture') {
                    statusText.textContent = '❌ لا يمكن الوصول للميكروفون';
                    isListening = false;
                    micBtn.classList.remove('listening');
                    micBtn.textContent = '🎤';
                    indicator.classList.remove('active');
                    stopVolumeMonitoring();
                } else if (event.error === 'aborted') {
                    // تم إيقاف الاستماع يدوياً
                    statusText.textContent = '⏸️ تم الإيقاف';
                } else {
                    statusText.textContent = `⚠️ خطأ: ${event.error}`;
                    // محاولة إعادة التشغيل التلقائي
                    if (isListening && !isRestarting) {
                        autoRestart();
                    }
                }
            };
        }
        
        // --- إعادة التشغيل التلقائي في حالة الأخطاء ---
        function autoRestart() {
            if (isRestarting || restartAttempts > 3) return;
            
            isRestarting = true;
            restartAttempts++;
            debugInfo.textContent = `🔄 محاولة إعادة التشغيل (${restartAttempts}/3)...`;
            
            try {
                if (recognition) {
                    recognition.stop();
                }
            } catch (e) {}
            
            setTimeout(() => {
                try {
                    if (recognition) {
                        recognition.start();
                        isRestarting = false;
                        debugInfo.textContent = '✅ تم إعادة التشغيل';
                    }
                } catch (e) {
                    debugInfo.textContent = `❌ فشل إعادة التشغيل: ${e.message}`;
                    isRestarting = false;
                }
            }, 500);
        }
        
        // --- تهيئة التعرف ---
        initRecognition();
        
        // --- زر الميكروفون (تبديل) ---
        micBtn.addEventListener('click', () => {
            if (!isListening) {
                try {
                    // إعادة تهيئة إذا لزم الأمر
                    if (!recognition) {
                        initRecognition();
                    }
                    recognition.start();
                } catch (e) {
                    if (e.message.includes('already started')) {
                        recognition.stop();
                        setTimeout(() => recognition.start(), 100);
                    } else {
                        statusText.textContent = '❌ خطأ: ' + e.message;
                        debugInfo.textContent = `خطأ: ${e.message}`;
                    }
                }
            } else {
                isRestarting = false;
                recognition.stop();
            }
        });
        
        // --- تحليل مستوى الصوت (بنفس تقنية الكود الأول) ---
        async function startVolumeMonitoring() {
            try {
                // الحصول على تدفق الصوت من الميكروفون
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                updateVolume();
            } catch (err) {
                console.warn('لا يمكن تحليل مستوى الصوت:', err);
                volumeText.textContent = '⚠️ لا يمكن قياس المستوى';
            }
        }
        
        function updateVolume() {
            if (!analyser || !isListening) {
                // استمر في التحديث حتى إذا توقف الاستماع
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }
                return;
            }
            
            try {
                analyser.getByteFrequencyData(dataArray);
                
                // حساب متوسط الشدة (0-255)
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                let average = sum / dataArray.length;
                
                // تحويل إلى مقياس 0-10
                let level = Math.min(10, Math.floor((average / 25.5) * 1.2));
                level = Math.max(0, level);
                
                // تحديث الشريط
                const percent = (level / 10) * 100;
                volumeBar.style.width = percent + '%';
                
                // تحديث النص مع أيقونات
                const icons = ['🔇', '🔈', '🔉', '🔊', '📢'];
                let iconIndex = Math.min(4, Math.floor(level / 2.5));
                volumeText.textContent = `${icons[iconIndex]} المستوى: ${level} / 10`;
                
                // تغيير لون الشريط حسب المستوى
                if (level < 3) {
                    volumeBar.style.background = 'linear-gradient(90deg, #00f260, #0575e6)';
                } else if (level < 6) {
                    volumeBar.style.background = 'linear-gradient(90deg, #f7971e, #ffd200)';
                } else {
                    volumeBar.style.background = 'linear-gradient(90deg, #f5576c, #f093fb)';
                }
                
                animationFrame = requestAnimationFrame(updateVolume);
            } catch (e) {
                console.warn('خطأ في تحديث مستوى الصوت:', e);
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }
            }
        }
        
        function stopVolumeMonitoring() {
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
            
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close();
                audioContext = null;
            }
            
            volumeBar.style.width = '0%';
            volumeText.textContent = '🔇 المستوى: 0 / 10';
        }
        
        // --- تنظيف عند إغلاق الصفحة ---
        window.addEventListener('beforeunload', () => {
            if (isListening && recognition) {
                try { recognition.stop(); } catch (e) {}
            }
            stopVolumeMonitoring();
        });
        
        // --- معالجة حالة الصفحة (عند العودة للصفحة) ---
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isListening) {
                // إذا غادر المستخدم الصفحة، نوقف الاستماع لتوفير الموارد
                if (recognition) {
                    try { recognition.stop(); } catch (e) {}
                }
            }
        });
        
        console.log('✅ التطبيق جاهز - استخدم الميكروفون لتحويل الكلام إلى نص فوري');
        debugInfo.textContent = '✅ جاهز للاستخدام';
    })();
</script>

</body>
</html>
