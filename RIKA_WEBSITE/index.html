<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تعرف صوت - حساسية عالية</title>
</head>
<body>
    <button id="btnMic">🎤 تسجيل o</button>
    <div id="divStatus">جاهز</div>
    <div id="divText"></div>
    <div id="divError"></div>
    <div id="divVolume">الصوت: 0</div>

    <script>
        // ============================================================
        // 1. المتغيرات العامة
        // ============================================================
        let recognizer = null;
        let isListening = false;
        let fullText = '';
        let finalResult = '';
        let audioCtx = null;
        let analyser = null;
        let stream = null;
        let volumeLevel = 0;
        let gainNode = null; // ⭐ جديد: للتحكم في حساسية الصوت

        // ============================================================
        // 2. عناصر الواجهة
        // ============================================================
        const btnMic = document.getElementById('btnMic');
        const divStatus = document.getElementById('divStatus');
        const divText = document.getElementById('divText');
        const divError = document.getElementById('divError');
        const divVolume = document.getElementById('divVolume');

        // ============================================================
        // 3. دوال العرض
        // ============================================================
        function showError(msg) {
            divError.textContent = '⚠️ ' + msg;
            console.error(msg);
        }

        function setStatus(msg) {
            divStatus.textContent = msg;
            console.log(msg);
        }

        function showText(text) {
            divText.textContent = text || '';
        }

        function showVolume(level) {
            divVolume.textContent = '🔊 الصوت: ' + level + '/10';
        }

        // ============================================================
        // 4. دوال التحكم الرئيسية
        // ============================================================
        function startListening() {
            if (isListening) {
                showError('الاستماع قيد التشغيل بالفعل');
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showError('المتصفح لا يدعم التعرف على الصوت');
                return;
            }

            recognizer = new SpeechRecognition();
            recognizer.lang = 'ar-SA';
            recognizer.continuous = true;
            recognizer.interimResults = true;
            
            // ⭐ تحسينات إضافية للتعرف
            recognizer.maxAlternatives = 1;

            recognizer.onstart = onStart;
            recognizer.onend = onEnd;
            recognizer.onresult = onResult;
            recognizer.onerror = onError;

            try {
                recognizer.start();
                setStatus('⏳ جاري بدء الاستماع...');
            } catch (e) {
                showError('فشل بدء الاستماع: ' + e.message);
            }
        }

        function stopListening() {
            if (!isListening) {
                showError('الاستماع متوقف بالفعل');
                return;
            }

            try {
                recognizer.stop();
                setStatus('⏹️ جاري الإيقاف...');
            } catch (e) {
                showError('فشل إيقاف الاستماع: ' + e.message);
            }
        }

        function toggleListening() {
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        }

        // ============================================================
        // 5. دوال الأحداث
        // ============================================================

        function onStart() {
            isListening = true;
            btnMic.textContent = '⏹️ إيقاف';
            setStatus('🔴 جاري الاستماع...');
            
            fullText = '';
            finalResult = '';
            showText('');
            
            startVolumeMonitor();
        }

        function onEnd() {
            isListening = false;
            btnMic.textContent = '🎤 تسجيل';
            setStatus('⏸️ متوقف');
            stopVolumeMonitor();
        }

        function onResult(event) {
            let interimText = '';
            let finalText = '';

            for (let i = event.resultIndex; i < event.results.length; i++) {
                const text = event.results[i][0].transcript.trim();
                
                if (event.results[i].isFinal) {
                    finalText = text;
                } else {
                    interimText = text;
                }
            }

            if (interimText) {
                if (fullText) {
                    fullText += ' ' + interimText;
                } else {
                    fullText = interimText;
                }
                showText(fullText);
                finalResult = '';
            } else if (finalText) {
                finalResult = finalText;
                fullText = '';
                showText(finalResult);
                setStatus('✅ تم التعرف على: "' + finalResult + '"');
            }
        }

        function onError(event) {
            const errors = {
                'not-allowed': 'تم رفض إذن الميكروفون',
                'no-speech': 'لم يتم سماع صوت - حاول التحدث بصوت أعلى',
                'audio-capture': 'مشكلة في الميكروفون',
                'network': 'مشكلة في الإنترنت',
                'aborted': 'تم الإيقاف'
            };
            const msg = errors[event.error] || 'خطأ: ' + event.error;
            showError(msg);
            setStatus('❌ ' + msg);

            if (['not-allowed', 'audio-capture'].includes(event.error)) {
                if (isListening) {
                    try { recognizer.stop(); } catch (e) {}
                }
            }
        }

        // ============================================================
        // 6. دوال قياس الصوت (محسنة للحساسية)
        // ============================================================
        async function startVolumeMonitor() {
            try {
                // ⭐ تحسين إعدادات الميكروفون للحساسية العالية
                stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,      // تقليل الصدى
                        noiseSuppression: false,     // ⭐ إيقاف تقليل الضوضاء (يحسن الحساسية)
                        autoGainControl: true,       // ⭐ تفعيل التحكم التلقائي بالكسب (مهم جداً)
                        sampleRate: 48000,           // جودة عالية
                        channelCount: 1              // أحادي
                    }
                });

                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // ⭐ إضافة عقدة تضخيم الصوت (Gain Node)
                gainNode = audioCtx.createGain();
                gainNode.gain.value = 2.0; // ⭐ مضاعفة الصوت (زيادة الحساسية)

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 512;  // ⭐ زيادة الدقة
                analyser.smoothingTimeConstant = 0.8;

                const source = audioCtx.createMediaStreamSource(stream);
                
                // ⭐ توصيل: مصدر ← تضخيم ← تحليل
                source.connect(gainNode);
                gainNode.connect(analyser);

                // ⭐ تغيير عتبة الصوت للكشف عن الأصوات المنخفضة
                updateVolume();
            } catch (e) {
                showError('لا يمكن قياس الصوت: ' + e.message);
            }
        }

        function stopVolumeMonitor() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            if (audioCtx && audioCtx.state !== 'closed') {
                audioCtx.close();
                audioCtx = null;
            }
            gainNode = null;
            volumeLevel = 0;
            showVolume(0);
        }

        function updateVolume() {
            if (!analyser || !isListening) {
                return;
            }

            try {
                const data = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(data);

                let sum = 0;
                for (let i = 0; i < data.length; i++) {
                    sum += data[i];
                }
                const avg = sum / data.length;
                
                // ⭐ معادلة محسنة للحساسية (تعطي قراءات أعلى للصوت المنخفض)
                let level = Math.min(10, Math.floor((avg / 15) * 1.8));
                level = Math.max(0, Math.min(10, level));

                volumeLevel = level;
                showVolume(level);

                // ⭐ عرض رسالة تنبيه إذا كان الصوت ضعيفاً
                if (isListening && level < 2) {
                    setStatus('🔇 صوت ضعيف - قرب الميكروفون أو تحدث بصوت أعلى');
                } else if (isListening && level >= 2 && level < 4) {
                    setStatus('🔊 صوت مقبول - استمر');
                } else if (isListening && level >= 4) {
                    setStatus('🔊 صوت جيد - واضح');
                }

                requestAnimationFrame(updateVolume);
            } catch (e) {
                showError('خطأ في قياس الصوت: ' + e.message);
            }
        }

        // ============================================================
        // 7. دوال الوصول
        // ============================================================
        function getVolumeLevel() { return volumeLevel; }
        function getFinalText() { return finalResult; }
        function getCurrentDisplayText() { return divText.textContent; }

        // ============================================================
        // 8. ربط الأحداث
        // ============================================================
        btnMic.addEventListener('click', toggleListening);

        // ============================================================
        // 9. بداية التشغيل
        // ============================================================
        setStatus('✅ جاهز - اضغط على زر التسجيل');
        showVolume(0);
    </script>
</body>
</html>
